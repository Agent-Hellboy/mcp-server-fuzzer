site_name: MCP Server Fuzzer
site_description: Security and robustness testing for Model Context Protocol servers
site_author: Agent-Hellboy
site_url: https://agent-hellboy.github.io/mcp-server-fuzzer

repo_name: Agent-Hellboy/mcp-server-fuzzer
repo_url: https://github.com/Agent-Hellboy/mcp-server-fuzzer
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  layout:
    navigation: left

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Agent-Hellboy/mcp-server-fuzzer
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/_agent_hellboy
  mermaid:
    version: 10.4.0
    theme: default

extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: pymdownx.slugs.slugify
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Assessments:
      - Choose an assessment path: getting-started/index.md
      - First assessment: getting-started/getting-started.md
      - Audit workflow: getting-started/audit-workflow.md
      - Audit recipes and fixtures: getting-started/examples.md
      - Evidence and findings: getting-started/results.md
  - Security controls:
      - Contain the target: components/safety.md
      - Network boundary: configuration/network-policy.md
      - Evidence in CI: security-ci.md
  - Configuration:
      - Assessment configuration: configuration/configuration.md
      - Configuration discovery: configuration/configuration-loader.md
  - Operator reference:
      - CLI reference: development/reference.md
      - Standardized output: development/standardized-output.md
      - Error codes: error-codes.md
  - Maintainer reference:
      - Contributing: development/contributing.md
      - Runtime management: components/runtime-management.md
      - Process management guide: components/process-management-guide.md
      - Process management: components/process-management.md
      - Custom transports: transport/custom-transports.md
      - Transport architecture: architecture/fuzzer-design.md
      - Client architecture: architecture/client-architecture.md
      - Fuzz engine architecture: architecture/fuzz-engine.md
      - Async executor: architecture/async-executor.md
      - Architecture overview: architecture/architecture.md
      - Exceptions: development/exceptions.md

# docs/FUZZING_STRATEGY.md is excluded by .gitignore, so it is absent from a
# clean checkout and cannot be published. It is intentionally not in `nav`.
# To publish it, remove the .gitignore entry and add it back here.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    not_found: warn
    omitted_files: ignore
